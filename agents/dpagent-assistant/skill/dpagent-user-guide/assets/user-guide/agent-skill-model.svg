<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-label="DPAgent agent and skill model">
  <rect width="1040" height="400" fill="#fbf8ff"/>
  <rect x="70" y="80" width="230" height="190" rx="20" fill="#ffffff" stroke="#b79cff" stroke-width="2"/>
  <text x="128" y="124" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#47336b">Default Role</text>
  <text x="112" y="166" font-family="Arial, sans-serif" font-size="15" fill="#47336b">没有选择 Agent 时</text>
  <text x="112" y="194" font-family="Arial, sans-serif" font-size="15" fill="#47336b">使用通用 DPAgent 助手</text>
  <rect x="405" y="80" width="230" height="190" rx="20" fill="#ffffff" stroke="#b79cff" stroke-width="2"/>
  <text x="466" y="124" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#47336b">@Agent</text>
  <text x="448" y="166" font-family="Arial, sans-serif" font-size="15" fill="#47336b">角色进入 system prompt</text>
  <text x="448" y="194" font-family="Arial, sans-serif" font-size="15" fill="#47336b">用户消息只保留真实输入</text>
  <rect x="740" y="80" width="230" height="190" rx="20" fill="#ffffff" stroke="#b79cff" stroke-width="2"/>
  <text x="800" y="124" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#47336b">Skill</text>
  <text x="780" y="166" font-family="Arial, sans-serif" font-size="15" fill="#47336b">可复用操作手册</text>
  <text x="780" y="194" font-family="Arial, sans-serif" font-size="15" fill="#47336b">按任务触发</text>
  <path d="M318 175 L386 175" stroke="#8d69e8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M653 175 L721 175" stroke="#8d69e8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="96" y="330" font-family="Arial, sans-serif" font-size="16" fill="#47336b">Agent 决定“以什么身份工作”；Skill 决定“遇到某类任务时怎么做”。两者可以组合使用。</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8d69e8"/>
    </marker>
  </defs>
</svg>

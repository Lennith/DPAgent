<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="DPAgent skill categories">
  <rect width="1040" height="420" fill="#fffdf6"/>
  <text x="62" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5e4a1d">Skill 来源</text>
  <rect x="70" y="92" width="180" height="118" rx="18" fill="#ffffff" stroke="#f0c75e" stroke-width="2"/>
  <text x="112" y="134" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5e4a1d">系统 Skill</text>
  <text x="106" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5e4a1d">运行环境提供</text>
  <rect x="288" y="92" width="180" height="118" rx="18" fill="#ffffff" stroke="#f0c75e" stroke-width="2"/>
  <text x="330" y="134" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5e4a1d">全局 Skill</text>
  <text x="316" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5e4a1d">所有工作区可用</text>
  <rect x="506" y="92" width="180" height="118" rx="18" fill="#ffffff" stroke="#f0c75e" stroke-width="2"/>
  <text x="548" y="134" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5e4a1d">工作区 Skill</text>
  <text x="534" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5e4a1d">只服务当前项目</text>
  <rect x="724" y="92" width="220" height="118" rx="18" fill="#ffffff" stroke="#f0c75e" stroke-width="2"/>
  <text x="772" y="134" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5e4a1d">Agent 专属 Skill</text>
  <text x="766" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5e4a1d">放在 Agent 的 skill/</text>
  <rect x="166" y="258" width="708" height="86" rx="20" fill="#fff4d6" stroke="#f0c75e" stroke-width="2"/>
  <text x="220" y="292" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5e4a1d">DPAI 分发 Skill</text>
  <text x="220" y="322" font-family="Arial, sans-serif" font-size="15" fill="#5e4a1d">例如 dpagent-update、dpagent-agent-create。可通过平台更新，不一定打进 npm 包。</text>

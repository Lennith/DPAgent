<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-label="DPAgent share link flow">
  <rect width="1040" height="360" fill="#f8fbff"/>
  <rect x="54" y="92" width="220" height="136" rx="18" fill="#ffffff" stroke="#8bb7ff" stroke-width="2"/>
  <text x="92" y="136" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24405f">PC DPAgent</text>
  <text x="86" y="172" font-family="Arial, sans-serif" font-size="15" fill="#24405f">当前会话</text>
  <text x="86" y="198" font-family="Arial, sans-serif" font-size="15" fill="#24405f">点击分享</text>
  <path d="M292 160 L424 160" stroke="#4f86d9" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="442" y="92" width="202" height="136" rx="18" fill="#ffffff" stroke="#8bb7ff" stroke-width="2"/>
  <text x="482" y="136" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24405f">Share Link</text>
  <text x="478" y="172" font-family="Arial, sans-serif" font-size="15" fill="#24405f">/dpagent-share/token</text>
  <text x="484" y="198" font-family="Arial, sans-serif" font-size="15" fill="#24405f">复制到剪贴板</text>
  <path d="M664 160 L796 160" stroke="#4f86d9" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="814" y="92" width="172" height="136" rx="18" fill="#ffffff" stroke="#8bb7ff" stroke-width="2"/>
  <text x="858" y="136" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24405f">手机/同事</text>
  <text x="850" y="172" font-family="Arial, sans-serif" font-size="15" fill="#24405f">只访问此会话</text>
  <text x="850" y="198" font-family="Arial, sans-serif" font-size="15" fill="#24405f">可观察或输入</text>
  <text x="70" y="292" font-family="Arial, sans-serif" font-size="16" fill="#24405f">分享链接只绑定当前 session。Settings、authoring、update 等完整权限接口不会对 share-only 用户开放。</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f86d9"/>
    </marker>
  </defs>
</svg>

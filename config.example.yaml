llmProfiles:
  defaultProfileId: default
  profiles:
    - id: default
      name: Default Profile
      provider: anthropic
      apiKey: ""
      apiBase: https://api.minimaxi.com
      defaultModel: MiniMax-M2.7-highspeed
      maxOutputTokens: 32768
      enabled: true
      capabilities:
        modelDiscovery: true
        reasoningEffort: false
        thinkingBudget: true

agent:
  maxSteps: 100
  tokenLimit: 210000
  workspaceDir: ./workspace
  contextDir: ./contexts
  runtimeDataDir: ./runtime
  globalAgentsDir: ./agents
  defaultToolset: windows-safe
  completionMarkerEnforcementEnabled: false
  subAgentMaxParallelPerParent: 4
  subAgentGlobalMaxParallel: 10
  contextReplayMinRounds: 6
  contextReplayMaxRounds: 12
  contextReplayBudgetRatio: 0.55
  contextOverflowMaxErrorsBeforeTrim: 2

tools:
  enableFileTools: true
  enableWeb: false
  enableShell: false
  shellType: powershell
  shellTimeout: 30000

mcp:
  enabled: false
  servers: []
  connectTimeout: 10
  executeTimeout: 60

retry:
  enabled: true
  maxRetries: 3
  initialDelay: 1
  maxDelay: 60
  exponentialBase: 2

contextBudget:
  defaultContextWindowTokens: 230000
  compressionTriggerRatio: 0.9
  postCompressionTargetRatio: 0.55
  minTokensAddedAfterCompression: 0
  compressionMaxChars: 6000
  precompressKeepLlmRounds: 5
  precompressChunkChars: 20000
  precompressRetry: 1
  reservedOutputTokens: 32768
  reservedReasoningTokens: 0
  reservedProtocolTokens: 4096
  modelOverrides: {}

remoteAccessAuth:
  enabled: false
  sessionTtlMs: 604800000
  trustProxy: false

agentProviders:
  - id: local-default
    type: local
    enabled: true
    timeoutMs: 300000

asr:
  enabled: false
